services:
  postgres:
    image: postgres:16-alpine
    container_name: oz-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ozaibot
    ports:
      - "5432:5432"
    volumes:
      - oz_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ozaibot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: oz-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - oz_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oz-migrate
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_DATABASE: ozaibot
      DB_SSL: "false"

      REDIS_HOST: redis
      REDIS_PORT: 6379

      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"
    command:
      - /bin/sh
      - -lc
      - |
        echo "[BOOT] running migrations..." &&
        node ./node_modules/typeorm/cli.js -d dist/src/database/migration-data-source.js migration:run

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oz-app
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_DATABASE: ozaibot
      DB_SSL: "false"

      REDIS_HOST: redis
      REDIS_PORT: 6379

      PORT: 3000
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    command: ["node", "dist/src/main.js"]

volumes:
  oz_postgres_data:
  oz_redis_data:
